# One service. No Postgres: at tens of users and ~30 new items a day the database
# is a few hundred kilobytes written by a single process, which is squarely what
# SQLite is for. Postgres would buy concurrent writers and pgvector — neither of
# which anything here needs yet — in exchange for a container, a password, and a
# backup story. Backup today is copying one file.
#
# Revisit when a second writer appears or vector search outgrows a Python loop.

services:
  bot:
    build: .
    image: ogoh:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Four slashes: sqlite://// means an absolute path. Three would put the
      # database somewhere inside the container and lose it on the next deploy.
      DATABASE_URL: sqlite:////data/ogoh.db
    volumes:
      - ogoh-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The admin panel. Same image and same database volume as the bot — a light
  # second reader with the occasional write (source/user edits, a manual run).
  admin:
    build: .
    image: ogoh:latest
    command: ["ogoh-admin"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/ogoh.db
      # 0.0.0.0 so the published port reaches it inside the container. The host
      # side below binds to loopback only, so it is not exposed to the internet —
      # reach it over an SSH tunnel. Set ADMIN_TELEGRAM_ID in .env first, or the
      # panel refuses every login.
      ADMIN_HOST: 0.0.0.0
    ports:
      # Host loopback only. To open it publicly instead, change to "8000:8000"
      # and put TLS (a reverse proxy) in front — the login travels in the clear.
      - "127.0.0.1:8000:8000"
    volumes:
      - ogoh-data:/data
    depends_on:
      - bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ogoh-data:
